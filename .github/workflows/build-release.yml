name: Build & Release Bru Chat

on:
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Extension Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Chrome MV3 Extension
        run: bun run build:chrome

      - name: Build Firefox MV2 Extension
        run: bun run build:firefox

      - name: Package Release Archives
        run: |
          mkdir -p release-assets

          # Package Chrome MV3 bundle
          if [ -d ".output/chrome-mv3" ]; then
            cd .output/chrome-mv3 && zip -r ../../release-assets/bru-chat-chrome-mv3.zip . && cd ../..
          elif [ -d "build/chrome-mv3" ]; then
            cd build/chrome-mv3 && zip -r ../../release-assets/bru-chat-chrome-mv3.zip . && cd ../..
          fi

          # Package Firefox MV2 bundle
          if [ -d ".output/firefox-mv2" ]; then
            cd .output/firefox-mv2 && zip -r ../../release-assets/bru-chat-firefox-mv2.zip . && cd ../..
          elif [ -d "build/firefox-mv2" ]; then
            cd build/firefox-mv2 && zip -r ../../release-assets/bru-chat-firefox-mv2.zip . && cd ../..
          fi

          # If wxt zip created archives in .output, copy those as well
          find .output -maxdepth 1 -name "*.zip" -exec cp {} release-assets/ \; 2>/dev/null || true

          ls -la release-assets/

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
